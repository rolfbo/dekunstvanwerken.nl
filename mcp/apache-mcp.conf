# Apache vhost for mcp.dekunstvanwerken.nl
# Requires: a2enmod proxy proxy_http
# certbot --apache -d mcp.dekunstvanwerken.nl adds the TLS vhost.
<VirtualHost *:80>
    ServerName mcp.dekunstvanwerken.nl

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8321/
    ProxyPassReverse / http://127.0.0.1:8321/

    # MCP is JSON over POST; keep timeouts generous for slow tools.
    ProxyTimeout 120

    ErrorLog ${APACHE_LOG_DIR}/mcp.dekunstvanwerken.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp.dekunstvanwerken.nl-access.log combined
</VirtualHost>
