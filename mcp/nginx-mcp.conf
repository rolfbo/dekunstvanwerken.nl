# nginx server block for mcp.dekunstvanwerken.nl
# Install: see instructions/mcp_setup.md
#
#   sudo cp mcp/nginx-mcp.conf /etc/nginx/sites-available/mcp.dekunstvanwerken.nl
#   sudo ln -s /etc/nginx/sites-available/mcp.dekunstvanwerken.nl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.dekunstvanwerken.nl   # adds the TLS block
server {
    listen 80;
    listen [::]:80;
    server_name mcp.dekunstvanwerken.nl;

    # certbot will rewrite this block for HTTPS; the proxy config below
    # is carried over into the TLS server block it generates.

    location / {
        proxy_pass http://127.0.0.1:8321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP responses are JSON; no buffering keeps latency low and is
        # forward-compatible with SSE if the server ever streams.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
