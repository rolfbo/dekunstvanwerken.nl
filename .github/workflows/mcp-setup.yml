name: MCP server setup (dkvw)

# One-time / re-runnable server-side setup for mcp.dekunstvanwerken.nl.
# Idempotent: safe to run again (e.g. after the DNS record is added, to
# let the certbot step complete). Requires the same secrets as deploy.yml.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  setup:
    name: Configure MCP service on server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run server-side setup
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "WEBROOT='${{ secrets.SSH_PATH }}' bash -s" <<'REMOTE'
          set -u
          say() { echo "== $*"; }
          WEBROOT="${WEBROOT%/}"

          say "MCP files present?"
          ls -la "$WEBROOT/mcp/" || { echo "FATAL: $WEBROOT/mcp missing — run the deploy workflow first"; exit 1; }

          say "sudo available?"
          if sudo -n true 2>/dev/null; then SUDO=1; echo "yes (passwordless)"; else SUDO=0; echo "NO — will print manual commands instead"; fi

          say "Node available?"
          # Non-login SSH shells miss nvm-style installs; check common spots.
          NODE_BIN="$(command -v node || true)"
          for cand in /usr/bin/node /usr/local/bin/node /opt/node*/bin/node; do
            [ -z "$NODE_BIN" ] && [ -x "$cand" ] && NODE_BIN="$cand"
          done
          if [ -z "$NODE_BIN" ] && [ "$SUDO" = 1 ]; then
            say "Installing Node.js via apt"
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq nodejs || true
            NODE_BIN="$(command -v node || true)"
            [ -z "$NODE_BIN" ] && [ -x /usr/bin/node ] && NODE_BIN=/usr/bin/node
          fi
          if [ -z "$NODE_BIN" ]; then
            echo "FATAL: node is not installed and could not be installed automatically."
            echo "Install manually: sudo apt install nodejs   (Node >= 18 required)"
            exit 1
          fi
          echo "node: $NODE_BIN ($("$NODE_BIN" --version))"
          case "$("$NODE_BIN" --version)" in
            v1[0-7].*|v[0-9].*) echo "FATAL: Node >= 18 required"; exit 1;;
          esac

          if [ "$SUDO" = 1 ]; then
            say "Install/refresh systemd unit"
            sudo -n cp "$WEBROOT/mcp/dkvw-mcp.service" /etc/systemd/system/dkvw-mcp.service
            # Point the unit at the actual webroot and node binary
            sudo -n sed -i "s|/var/www/dekunstvanwerken.nl|$WEBROOT|g; s|/usr/bin/node|$NODE_BIN|g" /etc/systemd/system/dkvw-mcp.service
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now dkvw-mcp
            sleep 1
            sudo -n systemctl restart dkvw-mcp
            sleep 1
            sudo -n systemctl --no-pager --lines=5 status dkvw-mcp || true

            say "Local health check"
            curl -fsS http://127.0.0.1:8321/healthz && echo || { echo "FATAL: healthz failed"; exit 1; }

            say "Reverse proxy setup"
            PROXY=""
            if command -v nginx >/dev/null; then
              PROXY=nginx
              sudo -n cp "$WEBROOT/mcp/nginx-mcp.conf" /etc/nginx/sites-available/mcp.dekunstvanwerken.nl
              sudo -n ln -sf /etc/nginx/sites-available/mcp.dekunstvanwerken.nl /etc/nginx/sites-enabled/mcp.dekunstvanwerken.nl
              sudo -n nginx -t && sudo -n systemctl reload nginx
            elif command -v apache2ctl >/dev/null || [ -d /etc/apache2 ]; then
              PROXY=apache
              sudo -n a2enmod proxy proxy_http >/dev/null
              sudo -n cp "$WEBROOT/mcp/apache-mcp.conf" /etc/apache2/sites-available/mcp.dekunstvanwerken.nl.conf
              sudo -n a2ensite mcp.dekunstvanwerken.nl >/dev/null
              sudo -n apache2ctl configtest && sudo -n systemctl reload apache2
              echo "apache vhost installed + reloaded"
            else
              echo "WARN: neither nginx nor apache found; MCP is only reachable on 127.0.0.1:8321"
            fi

            say "DNS check for mcp.dekunstvanwerken.nl"
            MYIP=$(curl -fsS -4 https://ifconfig.me 2>/dev/null || hostname -I | awk '{print $1}')
            MCPIP=$(getent hosts mcp.dekunstvanwerken.nl | awk '{print $1}' | head -1 || true)
            echo "server IP: $MYIP — mcp record: ${MCPIP:-none}"
            if [ -n "${MCPIP:-}" ] && [ -n "$PROXY" ]; then
              say "Run certbot (idempotent)"
              if command -v certbot >/dev/null; then
                if [ "$PROXY" = nginx ]; then CERTPLUG=--nginx; else CERTPLUG=--apache; fi
                sudo -n certbot $CERTPLUG -d mcp.dekunstvanwerken.nl \
                  --non-interactive --agree-tos --register-unsafely-without-email \
                  --keep-until-expiring || echo "WARN: certbot failed; check output above"
              else
                echo "WARN: certbot not installed; installing"
                if [ "$PROXY" = nginx ]; then PKG=python3-certbot-nginx; else PKG=python3-certbot-apache; fi
                sudo -n apt-get install -y -qq certbot "$PKG" || true
                if [ "$PROXY" = nginx ]; then CERTPLUG=--nginx; else CERTPLUG=--apache; fi
                sudo -n certbot $CERTPLUG -d mcp.dekunstvanwerken.nl \
                  --non-interactive --agree-tos --register-unsafely-without-email \
                  --keep-until-expiring || echo "WARN: certbot failed; check output above"
              fi
            else
              echo "SKIP certbot: no DNS record yet for mcp.dekunstvanwerken.nl."
              echo "Add an A record ->$MYIP at your DNS provider, then re-run this workflow."
            fi
          else
            echo ""
            echo "Run these manually on the server (needs root):"
            echo "  sudo cp $WEBROOT/mcp/dkvw-mcp.service /etc/systemd/system/"
            echo "  sudo systemctl daemon-reload && sudo systemctl enable --now dkvw-mcp"
            echo "  sudo cp $WEBROOT/mcp/nginx-mcp.conf /etc/nginx/sites-available/mcp.dekunstvanwerken.nl"
            echo "  sudo ln -s /etc/nginx/sites-available/mcp.dekunstvanwerken.nl /etc/nginx/sites-enabled/"
            echo "  sudo nginx -t && sudo systemctl reload nginx"
            echo "  sudo certbot --nginx -d mcp.dekunstvanwerken.nl"
            exit 2
          fi

          say "Done"
          REMOTE

      - name: Wipe SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
