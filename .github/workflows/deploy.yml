name: Deploy to dkvw

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync to server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check required secrets
        run: |
          missing=0
          for var in SSH_HOST SSH_USER SSH_PATH SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository secret ${var} is not set"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='instructions' \
            --exclude='scripts' \
            --exclude='data' \
            --exclude='node_modules' \
            --exclude='*.md' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/"

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          KEY=$(basename $(ls ./????????????????????????????????.txt | head -1) .txt)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          echo "IndexNow: submitting $(echo "$URLS" | tr ',' '\n' | wc -l) urls with key $KEY"
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"dekunstvanwerken.nl\",\"key\":\"$KEY\",\"keyLocation\":\"https://dekunstvanwerken.nl/$KEY.txt\",\"urlList\":[$URLS]}" \
            -w '\nHTTP %{http_code}\n' || echo "WARN: IndexNow ping failed (non-blocking)"

      - name: Server housekeeping + restart MCP (best effort)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'sudo -n /usr/bin/systemctl restart dkvw-mcp 2>/dev/null || true'

      - name: Wipe SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
